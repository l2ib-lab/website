project:
  type: website
  output-dir: _site
  resources:
    - CNAME

website:
  title: "L2IB"
  description: "Leukemia and Lymphoma Immune Biology — CIRI, Lyon"
  site-url: "https://www.l2ib.fr"
  repo-url: https://github.com/l2ib-lab/website
  favicon: images/favicon.svg
  open-graph: true
  twitter-card: true

  navbar:
    title: "L2IB"
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: tools/index.qmd
        text: Tools & Apps
      - href: publications.qmd
        text: Publications
      - href: team.qmd
        text: Team
      - href: join.qmd
        text: Join us
    right:
      - icon: github
        href: https://github.com/l2ib-lab
        aria-label: GitHub
      - icon: envelope
        href: mailto:contact@l2ib.fr
        aria-label: Contact

  page-footer:
    border: true
    left: |
      **L2IB** — Leukemia and Lymphoma Immune Biology<br>
      CIRI, Centre International de Recherche en Infectiologie<br>
      Inserm U1111 · CNRS UMR5308 · ENS de Lyon · UCBL1
    center:
      - text: "Mentions légales"
        href: legal.qmd
      - text: "CIRI"
        href: https://ciri.ens-lyon.fr/teams/lib
      - text: "GitHub"
        href: https://github.com/l2ib-lab
    right: |
      Built with [Quarto](https://quarto.org)

format:
  html:
    # Deux themes : Quarto ajoute automatiquement la bascule clair/sombre
    # dans la barre de navigation.
    theme:
      light: [cosmo, styles.scss]
      dark: [cosmo, styles-dark.scss]
    # Bandeau de titre sur toutes les pages internes. La page d'accueil a son
    # propre bandeau (bloc .hero dans index.qmd), habille a l'identique.
    title-block-banner: "#1c2f3d"
    toc: true
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    grid:
      sidebar-width: 250px
      body-width: 1000px
      margin-width: 240px
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..700;1,400&display=swap" rel="stylesheet">

bibliography: references.bib
# Style de citation. Téléchargez un .csl sur https://www.zotero.org/styles
# puis décommentez la ligne suivante :
# csl: vancouver.csl

execute:
  freeze: auto
